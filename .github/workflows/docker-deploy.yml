name: Docker Build and Push

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    environment: PRODUCTION

    permissions:
      contents: read
      packages: write

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # Get latest stable tag (falls back to the commit sha)
      # ---------------------------------------------------------
      - name: Get stable tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git tag -l "v*" | grep -v "dev" | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
            echo "No stable tag found, using $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Found tag: $TAG"

      # ---------------------------------------------------------
      # Repository name (lowercase for docker)
      # ---------------------------------------------------------
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Validate required GitHub variables (FAIL FAST)
      # ---------------------------------------------------------
      - name: Validate GitHub Variables
        run: |
          test -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" || { echo "Set the NEXT_PUBLIC_SITE_URL variable (PRODUCTION environment)"; exit 1; }

      # ---------------------------------------------------------
      # Docker setup
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # BUILD + PUSH (no build-time secrets: LLM keys are runtime env vars)
      # ---------------------------------------------------------
      - name: Build & Push Production Image
        run: |
          docker buildx build \
            --push \
            --file Dockerfile \
            --tag ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }} \
            --tag ghcr.io/${REPO_LC}:latest \
            --cache-from type=registry,ref=ghcr.io/${REPO_LC}:buildcache \
            --cache-to type=registry,ref=ghcr.io/${REPO_LC}:buildcache,mode=max \
            --provenance=false \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            .

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${REPO_LC}:${{ steps.get_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${REPO_LC}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run (port 3001, LLM keys at runtime):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 3001:3001 -e LLM7_API_KEY=... -e OPENROUTER_API_KEY=... -e OPENROUTER_MODEL=... ghcr.io/${REPO_LC}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
